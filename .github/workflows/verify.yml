name: Verify notebook

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PINN_RUN_MODE: smoke
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch and notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m ipykernel install --user --name python3
      - name: Execute all notebook cells, including fresh-training smoke checks
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=300 \
            --output smoke_executed.ipynb --output-dir results \
            laterally_loaded_piles.ipynb
      - name: Upload verification outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-verification
          path: |
            results/
            figures/
